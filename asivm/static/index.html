<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASIVM</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--fg:#171b22;--mut:#5f6b7a;--bd:#e2e5ea;--ac:#2f5bea;--acf:#fff;--crit:#c0291d;--high:#d4600a;--med:#9a7400;--low:#3d7a3a;--ok:#13804a;--side:#10151f;--sidefg:#c7cfdc;--hover:#f0f2f7}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171c25;--fg:#e8ebf0;--mut:#98a3b3;--bd:#272e3a;--ac:#6d93ff;--acf:#0b1020;--crit:#ff7f74;--high:#f4a261;--med:#e6c14f;--low:#8fc47a;--ok:#5fd39a;--side:#0a0d13;--sidefg:#b4bdcb;--hover:#1d2430}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.app{display:flex;min-height:100%}.side{width:220px;background:var(--side);color:var(--sidefg);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex:none}
.brand{font-weight:700;font-size:18px;color:#fff;padding:2px 10px 18px;letter-spacing:.3px}.brand small{display:block;font-weight:400;font-size:11px;color:var(--sidefg);letter-spacing:0}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}.side nav button{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--sidefg);cursor:pointer}
.side nav button:hover{background:rgba(255,255,255,.07)}.side nav button.on{background:var(--ac);color:var(--acf);font-weight:600}
.me{font-size:12px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}.me b{display:block;color:#fff;overflow:hidden;text-overflow:ellipsis}
.main{flex:1;min-width:0;padding:26px 30px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top h1{font-size:22px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 12px}.card h3{font-size:13px;margin:18px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.stat .n{font-size:30px;font-weight:700;line-height:1.1}.stat .l{color:var(--mut);font-size:12px;margin-top:4px}.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--ac)}
.btn{background:var(--ac);color:var(--acf);border:1px solid var(--ac);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}.btn:hover{filter:brightness(1.08)}.btn.alt{background:none;color:var(--fg);border-color:var(--bd);font-weight:500}.btn.alt:hover{background:var(--hover)}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}.fld{display:flex;flex-direction:column}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.row .fld{flex:1;min-width:140px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}tr.go{cursor:pointer}tr.go:hover td{background:var(--hover)}tr:last-child td{border-bottom:0}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--hover);color:var(--mut)}
.b.critical{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}.b.high{background:color-mix(in srgb,var(--high) 14%,transparent);color:var(--high)}
.b.medium{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med)}.b.low,.b.verified,.b.completed{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.b.failed{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}.b.open,.b.reopened{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.b.assigned,.b.in_progress,.b.running,.b.queued,.b.fixed{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med)}
.mut{color:var(--mut)}.sm{font-size:12px}.strong{font-weight:600}.od{color:var(--crit);font-weight:600}.nowrap{white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:34px 10px}.empty b{display:block;color:var(--fg);margin-bottom:4px}
.fix{background:color-mix(in srgb,var(--ok) 9%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 30%,var(--bd));border-radius:10px;padding:12px 14px}
.warn{background:color-mix(in srgb,var(--crit) 8%,var(--card));border:1px solid color-mix(in srgb,var(--crit) 30%,var(--bd));border-radius:10px;padding:10px 14px;margin-bottom:10px}
ol,ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.kv div:nth-child(odd){color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:5px 0}.bar span{width:110px;color:var(--mut)}.bar i{display:block;height:8px;border-radius:4px;background:var(--ac);min-width:2px}.bar em{font-style:normal;color:var(--mut);font-size:12px}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:14px}.tl div{margin-bottom:10px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(5,8,14,.5);opacity:0;pointer-events:none;transition:.15s;z-index:20}.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:.18s;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}.drawer.on{transform:none}
.dh{position:sticky;top:0;background:var(--bg);padding:16px 22px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:flex-start;z-index:1}.dh .t{flex:1;min-width:0}.dh h2{margin:0;font-size:18px;word-break:break-word}.db{padding:18px 22px 40px}
#toasts{position:fixed;bottom:18px;right:18px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(420px,90vw)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}.toast.err{background:var(--crit);color:#fff}
.login{max-width:380px;margin:9vh auto;padding:0 16px}.login .card{padding:26px}.login h1{margin:0 0 4px}.login input{width:100%;margin-bottom:12px}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:12px;background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.two{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px}@media(max-width:1000px){.two{grid-template-columns:1fr}}.hb{display:flex;align-items:center;gap:10px;margin:9px 0}.hb span{width:64px;color:var(--mut);text-transform:capitalize}.hb i{display:block;height:14px;border-radius:4px;min-width:3px}.hb b{min-width:24px}
.sb{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--hover);min-width:120px}.sb i{display:block;height:100%}.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}svg text{fill:var(--mut);font-size:11px}
.chip{display:inline-block;background:var(--hover);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}.side nav{flex-direction:row;flex-wrap:wrap}.brand{padding:4px 10px}.me{display:none}.main{padding:16px}}
</style></head><body>
<div id="root"></div><div id="toasts"></div><div class="ov" id="ov"></div><aside class="drawer" id="dr" aria-live="polite"></aside>
<script>
const S={view:'dashboard',token:localStorage.getItem('t'),role:localStorage.getItem('r'),email:localStorage.getItem('e'),team:[],f:{state:'open',tier:'',q:''}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>d?String(d).slice(0,10):'—',ftime=d=>d?String(d).slice(0,16).replace('T',' '):'—';
const lab=s=>String(s||'').replace(/_/g,' ');
const isAdmin=()=>S.role==='admin',canEdit=()=>S.role==='admin'||S.role==='analyst';
function toast(m,k){const t=document.createElement('div');t.className='toast'+(k==='err'?' err':'');t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),k==='err'?7000:3500)}
function errText(status,j){if(j&&typeof j==='object'){const d=j.detail;if(typeof d==='string')return d;
 if(Array.isArray(d))return d.map(x=>{const p=(x.loc||[]).filter(y=>y!=='body'&&y!=='query').join(' ');return(p?p+': ':'')+(x.msg||'invalid value')}).join('. ')}
 return status===403?"You don't have permission to do that.":status===413?'That file is too large.':status===404?'Not found.':'Something went wrong ('+status+').'}
async function api(p,o={}){o.headers=Object.assign({},o.headers,S.token?{Authorization:'Bearer '+S.token}:{});
 if(o.json!==undefined){o.body=JSON.stringify(o.json);o.headers['Content-Type']='application/json';o.method=o.method||'POST'}
 let r;try{r=await fetch('/api'+p,o)}catch{throw new Error('Cannot reach the server. Is it running?')}
 const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}
 if(r.status===401&&S.token){logout('Your session expired. Please sign in again.');throw new Error('Session expired')}
 if(!r.ok)throw new Error(errText(r.status,j));return j===null?t:j}
const act=async(fn,ok)=>{try{const r=await fn();if(ok)toast(ok);return r}catch(e){toast(e.message,'err')}};
function logout(m){localStorage.clear();S.token=null;boot(m)}
/* ---------- formatting helpers (no raw JSON anywhere) ---------- */
const tier=t=>`<span class="b ${esc(t)}">${esc(t)}</span>`,state=s=>`<span class="b ${esc(s)}">${esc(lab(s))}</span>`;
const tbl=(h,rows,empty)=>rows.length?`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="empty"><b>${esc(empty[0])}</b>${esc(empty[1]||'')}</div>`;
const ver=v=>v?[v.product,v.version].filter(Boolean).join(' ')||'unknown':'unknown';
function chg(c){const d=c.detail||{},a=esc(c.asset_name||'an asset');
 switch(c.kind){case'new_asset':return `New asset discovered: <b>${esc(d.name||c.asset_name)}</b>`;
 case'new_service':return `<b>${a}</b>: new service on port ${esc(d.port)}/${esc(d.protocol||'tcp')}${d.product?' ('+esc(ver(d))+')':''}`;
 case'service_removed':return `<b>${a}</b>: port ${esc(d.port)}/${esc(d.protocol||'tcp')} is no longer open`;
 case'version_changed':return `<b>${a}</b>: port ${esc(d.port)} changed from ${esc(ver(d.old))} to ${esc(ver(d.new))}`;
 case'asset_stale':return `<b>${a}</b> has not been seen recently`;case'asset_returned':return `<b>${a}</b> is back after being stale`}
 return esc(lab(c.kind))+' on '+a}
function scanSum(x){if(x.status==='running'&&x.started_at)return `Running for ${Math.max(0,Math.round((Date.now()-Date.parse(x.started_at+'Z'))/1000))}s…`;if(x.error)return `<span class="od">${esc(x.error)}</span>`;const s=x.summary||{};
 if(s.hosts!==undefined)return `${s.hosts} host${s.hosts==1?'':'s'} · ${s.new_assets||0} new · ${s.services_new||0} new service${s.services_new==1?'':'s'}`+(s.services_removed?` · ${s.services_removed} closed`:'')+` · ${s.findings_evaluated||0} finding${s.findings_evaluated==1?'':'s'} matched`;
 if(s.findings!==undefined)return `${s.findings} finding${s.findings==1?'':'s'} on ${esc(s.asset_name||'asset')}`;return x.status==='queued'||x.status==='running'?'Working…':''}
function kvs(o){return Object.entries(o||{}).filter(([k,v])=>v!==null&&v!==''&&typeof v!=='object').map(([k,v])=>`${esc(lab(k))}: ${esc(v)}`).join(' · ')}
/* ---------- drawer ---------- */
function drawer(title,sub,body){$('#dr').innerHTML=`<div class="dh"><div class="t"><h2>${title}</h2><div class="mut sm">${sub||''}</div></div><button class="btn alt" onclick="closeDr()">Close</button></div><div class="db">${body}</div>`;$('#dr').classList.add('on');$('#ov').classList.add('on');$('#dr').scrollTop=0}
function closeDr(){$('#dr').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeDr;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr()});
/* ---------- login ---------- */
async function boot(msg){if(S.token)return shell();let init=true;try{init=(await fetch('/api/auth/status').then(r=>r.json())).initialised}catch{}
 $('#root').innerHTML=`<div class="login"><div class="card"><h1>ASIVM</h1><p class="mut" style="margin:0 0 18px">${init?'Sign in to continue':'First-run setup: create the administrator account'}</p><div id="e">${msg?`<div class="msg">${esc(msg)}</div>`:''}</div>
 ${init?'':'<label>Organisation name</label><input id="org" autocomplete="organization">'}<label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="${init?'current-password':'new-password'}" placeholder="${init?'':'At least 10 characters'}">
 <button class="btn" id="go" style="width:100%">${init?'Sign in':'Create account'}</button></div></div>`;
 const go=async()=>{const e=$('#e'),bad=m=>e.innerHTML=`<div class="msg">${esc(m)}</div>`;e.innerHTML='';const em=$('#em').value.trim(),pw=$('#pw').value;
  if(!em||!pw)return bad('Enter your email and password.');
  try{if(!init){const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({org_name:$('#org').value.trim(),email:em,password:pw})});
    if(!r.ok){let j=null;try{j=await r.json()}catch{}return bad(errText(r.status,j))}}
   const r=await fetch('/api/auth/login',{method:'POST',body:new URLSearchParams({username:em,password:pw})});
   if(!r.ok){let j=null;try{j=await r.json()}catch{}return bad(r.status===401?'Incorrect email or password.':errText(r.status,j))}
   const j=await r.json();S.token=j.access_token;S.role=j.role;S.email=j.email;localStorage.setItem('t',S.token);localStorage.setItem('r',S.role);localStorage.setItem('e',S.email);shell()}
  catch{bad('Cannot reach the server. Is it running?')}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
/* ---------- shell ---------- */
const NAV=[['dashboard','Dashboard'],['findings','Findings'],['assets','Assets'],['ml','ML intelligence'],['owners','Owners &amp; teams'],['scans','Scans'],['scope','Scope'],['intel','Intelligence'],['team','Team'],['audit','Audit log']];
async function shell(){$('#root').innerHTML=`<div class="app"><div class="side"><div class="brand">ASIVM<small>Asset security intelligence &amp; visibility</small></div><nav>${NAV.filter(([k])=>!(['audit'].includes(k)&&!isAdmin())).map(([k,n])=>`<button data-v="${k}" class="${k===S.view?'on':''}">${n}</button>`).join('')}</nav>
 <div class="me"><b>${esc(S.email)}</b>${esc(S.role)} · <a onclick="logout()" style="color:#fff">Sign out</a></div></div><main class="main" id="m"></main></div>`;
 document.querySelectorAll('.side nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;shell()});
 try{S.team=await api('/team')}catch{}render()}
const go=v=>{S.view=v;shell()};
async function render(quiet){const m=$('#m');clearTimeout(window._t);if(!quiet)m.innerHTML='<p class="mut">Loading…</p>';try{await P[S.view](m)}catch(e){m.innerHTML=`<div class="msg">${esc(e.message)}</div>`}}
const head=(t,extra='')=>`<div class="top"><h1>${t}</h1>${extra}</div>`;
/* ---------- ML drawers ---------- */
async function revA(id,status){const note=status==='dismissed'?prompt('Why is this expected? (optional)')||null:null;if(await act(()=>api(`/ml/anomalies/${id}/review`,{json:{status,note}}),'Recorded'))render(true)}
async function openML(id){const d=await act(()=>api('/ml/assets/'+id));if(!d)return;const p=d.latest,mb=x=>`<span class="b ${x==='moderate'?'medium':esc(x)}">${esc(x)}</span>`;
 if(!p)return drawer(esc(d.asset.name),'ML assessment','<div class="empty"><b>No assessment yet</b>Use "Assess all assets" on the ML intelligence page.</div>');
 const fac=(e)=>p.factors.filter(f=>f.effect===e).map(f=>`<li>${esc(f.text)} <span class="mut sm">(${f.contribution>0?'+':''}${f.contribution})</span></li>`).join('')||'<li class="mut">none</li>';
 drawer(esc(d.asset.name),`${mb(p.predicted)} · risk index ${p.risk_index} · ${Math.round(p.confidence*100)}% confidence`,
 `${d.notice?`<div class="warn sm">${esc(d.notice)}</div>`:''}<div class="card"><h2>Class probabilities</h2>${Object.entries(p.probabilities).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${Math.max(1,v*100)}%"></i><em>${Math.round(v*100)}%</em></div>`).join('')}</div>
 <div class="card"><h2>Why this prediction</h2><h3>Raises risk</h3><ul>${fac('raises')}</ul><h3>Lowers risk</h3><ul>${fac('lowers')}</ul><p class="mut sm">Contributions come from ${esc(p.factors[0]?.method||'the model')} and are shown on a 0–1 risk scale.</p></div>
 ${p.shadow.length?`<div class="card"><h2>Candidate models (shadow, not used for decisions)</h2>${p.shadow.map(s=>`<div class="sm">${esc(s.model_version)}: ${mb(s.predicted)} ${Math.round(s.confidence*100)}%</div>`).join('')}</div>`:''}
 ${d.anomalies.length?`<div class="card"><h2>Recent unusual changes</h2>${d.anomalies.map(e=>`<div class="sm">${ftime(e.created_at)} · ${state(e.status)} ${e.factors.map(f=>esc(f.text)).join('; ')}</div>`).join('')}</div>`:''}
 ${canEdit()?`<div class="card"><h2>Your assessment</h2><p class="mut sm" style="margin-top:-6px">A second person must approve it before it can be used to train a model.</p><div class="row"><div class="fld"><label>Risk level</label><select id="fl">${['low','moderate','high','critical'].map(x=>`<option ${x===p.predicted?'selected':''}>${x}</option>`).join('')}</select></div><div class="fld" style="flex:1"><label>Note</label><input id="fn"></div><button class="btn" id="fb">Submit</button></div></div>`:''}
 <div class="mut sm">Model ${esc(p.model_version)} · features ${esc(p.feature_version)} · ${ftime(p.at)}</div>`);
 if($('#fb'))$('#fb').onclick=()=>act(()=>api(`/ml/assets/${id}/feedback`,{json:{label:$('#fl').value,note:$('#fn').value||null}}),'Submitted for approval')}
/* ---------- finding rows ---------- */
function fRow(f){return `<tr class="go" onclick="openF(${f.id})"><td class="nowrap">${tier(f.risk_tier)} <b>${f.risk_score}</b></td>
 <td><div class="strong">${esc(f.cve_id)}${f.kev?' <span class="b critical" title="Known exploited (CISA KEV)">exploited</span>':''}</div><div class="sm mut">${esc(f.fix_hint)}</div></td>
 <td><div class="strong">${esc(f.asset_name)}</div><div class="sm mut">${esc(f.ips.join(', '))}${f.port?' · '+esc(f.port):''}${f.software?' · '+esc(f.software):''}</div></td>
 <td><div>${f.owner?esc(f.owner):'<span class="mut">No owner</span>'}</div><div class="sm mut">${[f.department,f.location].filter(Boolean).map(esc).join(' · ')}</div></td>
 <td>${f.assignee?esc(f.assignee):'<span class="mut">Unassigned</span>'}</td><td>${state(f.state)}</td>
 <td class="nowrap ${f.overdue?'od':''}">${fdate(f.due_at)}${f.overdue?'<div class="sm">overdue</div>':''}</td></tr>`}
const FH=['Risk','Finding &amp; fix','Asset','Owner &amp; location','Assigned to','Status','Due'];
/* ---------- charts (inline SVG, no libraries) ---------- */
const TC={critical:'var(--crit)',high:'var(--high)',medium:'var(--med)',low:'var(--low)'};
function tierBars(t){const mx=Math.max(1,...Object.values(t));return ['critical','high','medium','low'].map(k=>`<div class="hb"><span>${k}</span><i style="width:${Math.max(3,t[k]/mx*100)}%;background:${TC[k]};max-width:calc(100% - 110px)"></i><b>${t[k]}</b></div>`).join('')}
function lineChart(rows,series){if(rows.length<2)return `<div class="empty"><b>The trend builds up over time</b>One point is stored per day, and after every scan or status change. Check back after the next scan.</div>`;
 const W=620,H=210,p={l:34,r:12,t:12,b:26},mx=Math.max(1,...rows.flatMap(r=>series.map(q=>r[q.k]||0))),X=i=>p.l+i*(W-p.l-p.r)/(rows.length-1),Y=v=>H-p.b-v/mx*(H-p.t-p.b);
 const grid=[0,.5,1].map(f=>{const v=Math.round(mx*f),y=Y(v);return `<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${p.l-6}" y="${y+4}" text-anchor="end">${v}</text>`}).join('');

const COMP={cvss:'Technical severity (CVSS)',kev:'Exploited in the wild (KEV)',epss:'Exploit likelihood (EPSS)',criticality:'Asset criticality',exposure:'Network exposure'};
async function openF(id){let f;try{f=await api('/findings/'+id)}catch(e){return toast(e.message,'err')}
 const r=f.remediation,a=f.asset,v=f.vulnerability,ev=f.evidence||{},sw=ev.software||{},mt=ev.matching||{},comp=(f.risk_inputs||{}).components||{},mx={cvss:40,kev:25,epss:20,criticality:8,exposure:7};
 const next=({open:['assigned','in_progress','fixed','accepted_risk'],assigned:['in_progress','fixed','accepted_risk','open'],in_progress:['fixed','assigned','accepted_risk'],reopened:['assigned','in_progress','fixed','accepted_risk'],fixed:['reopened'],verified:['reopened'],accepted_risk:['open']})[f.state]||[];
 drawer(`${esc(f.cve_id)} on ${esc(f.asset_name)}`,`${tier(f.risk_tier)} risk ${f.risk_score} · ${state(f.state)}`,`
 <p style="margin-top:0">${esc(v.description||'No description available.')}</p>
 ${r.urgency?`<div class="warn"><b>${esc(r.urgency)}</b></div>`:''}
 <div class="card"><h2>How to fix</h2><div class="fix"><b>${esc(r.headline)}</b>${r.sla?`<div class="sm mut">${esc(r.sla)}</div>`:''}</div>
  <h3>Steps</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  <h3>If you can't patch right away</h3><ul>${r.workarounds.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
  <h3>References</h3><ul>${r.references.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a></li>`).join('')}</ul>
  <div style="margin-top:12px"><button class="btn alt" id="cp">Copy as ticket text</button></div></div>
 <div class="card"><h2>Who and where</h2><div class="kv"><div>Asset</div><div><a onclick="openA(${a.id})">${esc(a.name)}</a></div><div>Addresses</div><div>${esc(a.ips.join(', ')||'—')}</div>
  <div>Service</div><div>${esc([sw.port?sw.port+'/'+(sw.protocol||'tcp'):'',sw.name,sw.version].filter(Boolean).join(' · ')||'—')}</div>
  <div>Owner</div><div>${a.owner?esc(a.owner)+(a.owner_email?` (<a href="mailto:${esc(a.owner_email)}">${esc(a.owner_email)}</a>)`:''):'<span class="mut">Not set. Add one on the asset.</span>'}</div>
  <div>Department</div><div>${esc(a.department||'—')}</div><div>Location</div><div>${esc(a.location||'—')}</div><div>Exposure</div><div>${esc(a.exposure)} · criticality ${a.criticality}/5</div>
  <div>Assigned to</div><div>${f.assignee?esc(f.assignee):'<span class="mut">Nobody yet</span>'}</div><div>Fix by</div><div class="${f.overdue?'od':''}">${fdate(f.due_at)}${f.overdue?' (overdue)':''}</div></div></div>
 ${canEdit()&&next.length?`<div class="card"><h2>Update status</h2><div class="row"><div class="fld"><label>Move to</label><select id="to">${next.map(x=>`<option value="${x}">${lab(x)}</option>`).join('')}</select></div>
  <div class="fld"><label>Assign to</label><input id="as" list="tm" value="${esc(f.assignee||'')}" placeholder="pick or type"><datalist id="tm">${S.team.map(x=>`<option value="${esc(x.email)}">`).join('')}</datalist></div></div>
  <div class="row"><div class="fld"><label>Note (required to accept risk)</label><input id="nt"></div><button class="btn" id="tr">Apply</button>${f.source==='intel'?'<button class="btn alt" id="vf">Verify by re-scan</button>':''}</div>
  <p class="mut sm" style="margin:0">'Verified' is set automatically when a re-scan no longer sees the problem.</p></div>`:''}
 <div class="card"><h2>Why this score</h2>${Object.keys(comp).map(k=>`<div class="bar"><span>${COMP[k]||k}</span><i style="width:${Math.max(2,(comp[k]/mx[k])*140)}px"></i><em>+${comp[k]}</em></div>`).join('')}
  <div class="sm mut" style="margin-top:8px">${esc(f.why)}${(f.risk_inputs||{}).floor_applied?'. '+esc(f.risk_inputs.floor_applied):''}</div></div>
 <div class="card"><h2>Evidence</h2><div class="kv"><div>Detected by</div><div>${ev.scan_id?'Scan #'+ev.scan_id:'Intelligence re-match'}</div><div>Software</div><div>${esc([sw.name,sw.version].filter(Boolean).join(' ')||'—')}</div>
  ${sw.cpe?`<div>Identifier (CPE)</div><div class="sm">${esc(sw.cpe)}</div>`:''}${sw.extrainfo?`<div>Banner detail</div><div>${esc(sw.extrainfo)}</div>`:''}
  <div>Match method</div><div>${esc(mt.method||f.match_method)} at ${Math.round((f.match_confidence||0)*100)}% confidence</div>
  ${mt.affected_range?`<div>Affected versions</div><div>${esc(Object.entries(mt.affected_range).map(([k,x])=>({version_exact:'exactly ',start_incl:'from ',start_excl:'after ',end_incl:'up to and including ',end_excl:'before '})[k]+x).join(', '))}</div>`:''}</div>
  ${(mt.notes||[]).length?`<ul>${mt.notes.map(n=>`<li class="sm">${esc(n)}</li>`).join('')}</ul>`:''}</div>
 <div class="card"><h2>History</h2><div class="tl">${f.history.map(h=>`<div><b>${esc(lab(h.to_state))}</b> <span class="mut sm">· ${esc(h.actor)} · ${ftime(h.at)}</span>${h.note?`<div class="sm">${esc(h.note)}</div>`:''}</div>`).join('')}</div></div>`);
 $('#cp').onclick=async()=>{const t=[`${f.cve_id} on ${f.asset_name} (${a.ips.join(', ')})`,`Risk: ${f.risk_tier} (${f.risk_score})`,r.urgency||'',`Owner: ${a.owner||'unassigned'}${a.location?' · '+a.location:''}`,`Fix by: ${fdate(f.due_at)}`,'',`Fix: ${r.headline}`,...r.steps.map((s,i)=>`${i+1}. ${s}`)].filter(x=>x!==null).join('\n');try{await navigator.clipboard.writeText(t);toast('Copied')}catch{toast('Copy is not available in this browser','err')}};
 if($('#tr'))$('#tr').onclick=async()=>{if(await act(()=>api(`/findings/${id}/transition`,{json:{to_state:$('#to').value,assignee:$('#as').value.trim()||null,note:$('#nt').value.trim()||null}}),'Status updated')){openF(id);render()}};
 if($('#vf'))$('#vf').onclick=async()=>{if(await act(()=>api(`/findings/${id}/verify`,{method:'POST'}),'Verification scan started. Reopen this finding in a minute.'))closeDr()}}
/* ---------- asset drawer ---------- */
async function openA(id){let a;try{a=await api('/assets/'+id)}catch(e){return toast(e.message,'err')}
 const e=canEdit();const inp=(k,l,t='text')=>`<div class="fld"><label>${l}</label><input id="a_${k}" type="${t}" value="${esc(a[k]||'')}" ${e?'':'disabled'}></div>`;
 drawer(esc(a.name),`Asset #${a.id} · ${esc(a.status)} · first seen ${fdate(a.first_seen)} · last seen ${ftime(a.last_seen)}`,`
 <div class="card"><h2>Ownership and context</h2><div class="row">${inp('owner','Owner')}${inp('owner_email','Owner email','email')}</div><div class="row">${inp('department','Department')}${inp('location','Location (site, room, rack, cloud region)')}</div>
 <div class="row"><div class="fld"><label>Exposure</label><select id="a_exposure" ${e?'':'disabled'}>${['internal','dmz','internet'].map(x=>`<option ${x===a.exposure?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="fld"><label>Criticality (1 low to 5 mission critical)</label><input id="a_criticality" type="number" min="1" max="5" value="${a.criticality}" ${e?'':'disabled'}></div></div>
 ${e?'<button class="btn" id="sv">Save</button> <span class="mut sm">Changing exposure or criticality re-scores open findings.</span>':''}</div>
 <div class="card"><h2>Findings</h2>${tbl(['Risk','CVE','Status','Fix by'],a.findings.map(f=>`<tr class="go" onclick="openF(${f.id})"><td>${tier(f.risk_tier)} ${f.risk_score}</td><td>${esc(f.cve_id)}</td><td>${state(f.state)}</td><td class="sm">${fdate(f.due_at)}</td></tr>`),['No findings'])}</div>
 <div class="card"><h2>Services</h2>${tbl(['Port','Service','Software','State'],a.services.map(s=>`<tr><td>${s.port}/${esc(s.protocol)}</td><td>${esc(s.service||'')}</td><td>${esc([s.product,s.version].filter(Boolean).join(' '))}</td><td>${s.active?'open':'<span class="mut">closed</span>'}</td></tr>`),['No services recorded'])}</div>
 <div class="card"><h2>Known identifiers</h2><p class="mut sm" style="margin-top:-6px">ASIVM keeps all of these tied to this one asset, so it stays the same asset when its IP changes.</p>${a.identifiers.map(i=>`<span class="chip" style="${i.active?'':'opacity:.5'}">${esc(i.type)}: ${esc(i.value)}</span>`).join('')}</div>
 <div class="card"><h2>History</h2>${a.changes.length?`<div class="tl">${a.changes.map(c=>`<div>${chg({...c,asset_name:a.name})} <span class="mut sm">· ${ftime(c.at)}</span></div>`).join('')}</div>`:'<div class="empty">No changes recorded.</div>'}</div>`);
 if($('#sv'))$('#sv').onclick=async()=>{const g=k=>$('#a_'+k).value.trim()||null;if(await act(()=>api('/assets/'+id,{method:'PATCH',json:{owner:g('owner'),owner_email:g('owner_email'),department:g('department'),location:g('location'),exposure:$('#a_exposure').value,criticality:+$('#a_criticality').value}}),'Saved')){openA(id);render()}}}
boot();
</script></body></html>
